<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore arsenic screening strategies</title>

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cluster-overrides.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body,
    button,
    select,
    input,
    textarea,
    label,
    p,
    span,
    div,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      height: 100vh;
      min-height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
      gap: 0;
      overflow: hidden;
      box-sizing: border-box;
      background: #ffffff;
    }

    .control-panel {
      height: 100%;
      min-height: 0;
      overflow: auto;
      box-sizing: border-box;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-panel {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      background: #f7f7f7;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      z-index: 1;
    }

    .map-legend-shell {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 500;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map-search-shell {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 500;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-status {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 600;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* font unification overrides */
    .control-panel h1,
    .control-panel h2,
    .control-panel h3,
    .control-panel p,
    .control-panel label,
    .control-panel select,
    .control-panel button,
    .map-legend-shell,
    .map-legend-shell button,
    .map-legend-shell div,
    .map-layers-panel,
    .map-layers-panel h2,
    .map-layers-panel label,
    .map-layers-panel p,
    .map-toolbar,
    .map-toolbar button,
    .map-search-row,
    .map-search-row input,
    .map-search-row button,
    .leaflet-control,
    .leaflet-popup-content-wrapper,
    .leaflet-popup-content,
    .leaflet-tooltip,
    .leaflet-container {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    }
  </style>
<link rel="stylesheet" href="map.css" />
</head>
<body>
  <main class="app-shell">
    <section class="control-panel" aria-labelledby="controls-title">
      <div><h2 id="controls-title">Explore arsenic screening strategies</h2><p class="panel-copy">Switch screening strategies to explore the team’s results.</p></div>
      <div class="field-group"><label for="package-select">Screening strategy</label><select id="package-select" name="package-select"></select><p id="strategy-purpose" class="panel-copy"></p></div>
      <p class="data-note">This map supports public awareness and does not replace individual water testing.</p>
    </section>

    <section class="map-panel" aria-label="Interactive arsenic risk map">
      <div id="map"></div>

      <div class="map-legend-shell" id="map-legend-shell" aria-label="Map legend">
        <button id="legend-toggle" class="map-legend-toggle" type="button" aria-expanded="true" aria-controls="map-legend-content">
          <span class="legend-toggle-text">Legend</span>
          <span class="legend-toggle-icon" aria-hidden="true">-</span>
        </button>
        <div id="map-legend-content" class="map-legend-content"></div>
      </div>

      <div id="map-search-shell" class="map-search-shell is-collapsed" aria-label="Search and map tools">
        <div class="map-toolbar">
          <button
            id="search-toggle"
            class="map-toolbar-button search-toggle-button"
            type="button"
            aria-label="Open search"
            aria-expanded="false"
            aria-controls="map-search-panel"
            title="Open search"
          >
            <span class="search-icon" aria-hidden="true"></span>
          </button>

          <div id="map-search-panel" class="search-row map-search-row" hidden>
            <input
              id="search-input"
              name="search-input"
              type="search"
              aria-label="Search ZIP code, municipality, or address"
              placeholder="Search ZIP code, municipality, or address"
              autocomplete="street-address"
            />
            <span class="search-divider" aria-hidden="true"></span>
            <button id="search-button" class="search-icon-button" type="button" aria-label="Search" title="Search">
              <span class="search-icon" aria-hidden="true"></span>
            </button>
          </div>

          <button id="locate-button" class="map-toolbar-button locate-toolbar-button" type="button" aria-label="Use my location" title="Use my location">
            <span class="locate-icon" aria-hidden="true"></span>
          </button>

          <button
            id="layers-toggle"
            class="map-toolbar-button layers-toggle-button"
            type="button"
            aria-label="Open map layers"
            aria-expanded="false"
            aria-controls="map-layers-panel"
            title="Layers"
          >
            <svg class="layers-icon" viewBox="0 0 25 25.2" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M12.6,20.8L3.7,15.7.1,17.8l12.4,7.2,12.5-7.1-3.6-2.1-8.8,5ZM12.6,15.5L3.7,10.4l-3.7,2.1,12.5,7.2,12.5-7.2-3.6-2.1-8.8,5.1ZM25,7.2L12.4,0,0,7.1l12.5,7.2,12.5-7.1Z" /></svg>
          </button>

          <button
            id="refresh-button"
            class="map-toolbar-button refresh-toolbar-button"
            type="button"
            aria-label="Reset map view"
            title="Reset map view"
          >
            <svg class="refresh-icon" viewBox="0 0 96 100" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M83.8,13.2C74.9,5,63,0,50,0,22.4,0,0,22.4,0,50s22.4,50,50,50,26.2-5.6,35.3-14.6l-9.9-9.9c-6.5,6.5-15.5,10.5-25.4,10.5-19.9,0-36-16.1-36-36S30.1,14,50,14s17.5,3.4,23.9,9.1l-11.9,11.9h34V1l-12.2,12.2Z" /></svg>
          </button>
        </div>

        <aside id="map-layers-panel" class="map-layers-panel" aria-labelledby="map-layers-title" hidden>
          <div class="map-layers-header">
            <h2 id="map-layers-title">Map Layers</h2>
            <button id="layers-close" class="map-layers-close" type="button" aria-label="Close map layers" title="Close layers">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>

          <div class="map-layers-content">
            <label class="layer-toggle-row" for="layer-private-wells">
              <span class="layer-checkbox">
                <input id="layer-private-wells" type="checkbox" checked />
                <span class="layer-checkbox-box" aria-hidden="true"></span>
              </span>
              <span class="layer-toggle-label">Private Wells</span>
            </label>

            <label class="layer-toggle-row" for="layer-county-subdivisions">
              <span class="layer-checkbox">
                <input id="layer-county-subdivisions" type="checkbox" />
                <span class="layer-checkbox-box" aria-hidden="true"></span>
              </span>
              <span class="layer-toggle-label">County Subdivisions</span>
            </label>

            <label class="layer-toggle-row" for="layer-zip-areas">
              <span class="layer-checkbox">
                <input id="layer-zip-areas" type="checkbox" />
                <span class="layer-checkbox-box" aria-hidden="true"></span>
              </span>
              <span class="layer-toggle-label">ZIP Code Areas</span>
            </label>

            <label class="layer-toggle-row" for="layer-geology">
              <span class="layer-checkbox">
                <input id="layer-geology" type="checkbox" />
                <span class="layer-checkbox-box" aria-hidden="true"></span>
              </span>
              <span class="layer-toggle-label">Geologic Formations</span>
            </label>

            <p id="layer-panel-status" class="layer-panel-status" aria-live="polite"></p>
          </div>
        </aside>
      </div>

      <div id="map-status" class="map-status" role="status" aria-live="polite">Loading map data...</div>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="vendor/turf.min.js"></script>
  <script src="core.js"></script>
  <script src="map.js"></script>
</body>
</html>
